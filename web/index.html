<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183c37">
  <title>觅长生 · 宁州一梦（C++ 版）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='18' fill='%23183c37'/%3E%3Ctext x='40' y='55' text-anchor='middle' font-size='49' fill='%23e4d9bf'%3E仙%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="enhance.css">
  <link rel="stylesheet" href="manuals-art.css">
  <link rel="stylesheet" href="build.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="tianji.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#"><span class="seal">觅</span><span>觅长生<small>宁 州 一 梦</small></span></a>
      <div class="side-label">此 生 行 卷 <span>壹</span></div>
      <section id="player-card" aria-label="人物状态"></section>
      <section id="npc-card" aria-label="眼前道友" hidden></section>
      <section id="progress-card" aria-label="修炼进度"></section>
      <div class="side-footer"><span class="small-seal">宁</span><p>山河自有岁月<br>你我各寻长生</p><span class="version">C++ · 07</span></div>
    </aside>
    <main>
      <header class="topbar">
        <div class="breadcrumb">九州 <span>/</span> 宁州 <span>/</span> <b>这一世</b></div>
        <div class="toolbar">
          <span id="save-status" role="status">云端存档</span>
          <button class="icon-button" data-action="help" title="玩法说明" aria-label="玩法说明">?</button>
          <button class="subtle" data-action="settings">存档与设置</button>
          <button class="subtle restart" data-action="new">重启一世 <span>↗</span></button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <div class="eyebrow"><i></i> 修仙人生模拟 · C++ 规则引擎</div>
          <h1>一梦宁州，<em>岁月成仙。</em></h1>
          <p>从一介散修开始，写下属于你的长生之路。</p>
          <div id="hero-time" class="hero-time"></div>
        </div>
        <div class="landscape" aria-hidden="true">
          <svg viewBox="0 0 620 235" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="mountain" x2="0" y2="1"><stop stop-color="#6e8980" stop-opacity=".48"/><stop offset="1" stop-color="#aec0af" stop-opacity=".05"/></linearGradient><linearGradient id="river" x2="1" y2="1"><stop stop-color="#b7c8bf" stop-opacity=".5"/><stop offset="1" stop-color="#eee9de" stop-opacity="0"/></linearGradient></defs>
          <circle cx="444" cy="57" r="25" fill="#cbaa70" opacity=".42"/><path d="M0 193 L70 100 96 115 150 37 205 103 254 75 323 154 388 100 441 137 499 61 548 119 590 92 620 145V235H0Z" fill="url(#mountain)"/><path d="M45 210L103 166 138 186 210 114 244 158 283 142 341 185 394 137 460 202 540 157 620 202V235H45Z" fill="#789188" opacity=".25"/><path d="M153 42l-20 44 8-3-10 18 26-12 22 14-17-33" fill="#eee9de" opacity=".46"/><path d="M488 200 C409 188 417 215 342 216 S233 205 183 235H620V204Z" fill="url(#river)"/><path d="M122 197q20-7 35 0m359-14q27-9 40-3" fill="none" stroke="#748b7d" opacity=".45"/><g stroke="#425f50" fill="none" stroke-width="2" opacity=".42"><path d="M542 204v-54m0 4-20 12m20-3 19 6m-19-2-28 16m28-7 24 11m-24-15-13-6"/><path d="M564 216v-39m0 1-12 7m12-1 12 7m-12-2-15 11"/></g><g fill="none" stroke="#637c70" opacity=".6"><path d="M360 53q5-4 9 0 4-5 8-1m-42 11q4-3 7 0 3-4 7-1"/></g><g fill="#546f62" opacity=".7"><path d="M389 198h28v3h-28zM394 186h17v12h-17zM388 186l15-9 15 9z"/></g></svg>
          <div class="vertical-poem">天地一逆旅<br>同悲万古尘</div>
        </div>
      </section>

      <section id="world-strip" class="world-strip" aria-label="天下概况"></section>

      <div id="tianji-reminder"></div>

      <nav class="main-tabs" aria-label="主要页面">
        <button class="active" data-tab="chronicle"><span>◷</span> 岁月纪事</button>
        <button data-tab="map"><span>⌁</span> 宁州舆图</button>
        <button data-tab="dungeon"><span>♜</span> 秘境探索</button>
        <button data-tab="arts">☯ 洞府道法</button>
        <button data-tab="society">♧ 宗门知交</button>
        <button data-tab="roster">✉ 好友通讯录</button>
        <button data-tab="quests">✦ 机缘成就</button>
        <button data-tab="economy">⚑ 任务</button>
        <button data-tab="workshop">⚒ 工坊</button>
        <button data-tab="market"><span>◇</span> 坊市</button>
        <button data-tab="inventory"><span>▧</span> 行囊与面板</button>
        <button data-tab="tianji">✧ 天机大比</button>
        <span class="tab-end">因果有迹 · 岁月有声</span>
      </nav>

      <section id="workspace" class="workspace" aria-live="polite"></section>

      <footer class="page-footer">
        <span>《觅长生》世界观同人实验 · 规则由 C++ 引擎计算</span>
        <span>多人联机版 <i></i> 各自独立存档</span>
      </footer>
    </main>
  </div>

  <div id="build-host"></div>
    <div id="story-host"></div>

    <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <dialog id="settings-modal" aria-label="存档与行卷"></dialog>
  <dialog id="battle-target-modal" aria-label="选择本场移除的神通"></dialog>
  <dialog id="location-art-modal" aria-labelledby="location-art-title"></dialog>

  <script type="module" src="app.mjs"></script>
  <script type="module" src="leaderboard.mjs"></script>
  <script type="module" src="feedback.mjs"></script>
  <script type="module" src="mobile.mjs"></script>
</body>
</html>
